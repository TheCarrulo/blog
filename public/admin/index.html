<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Backoffice — Carrulo in Bytes</title>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.3/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'thecarrulo/blog',
            branch: 'master',
            auth_type: 'pkce',
            app_id: 'Ov23liyN9UX9AhHLrk8B',
          },
          media_folder: 'public/images',
          public_folder: '/blog/images',
          collections: [
            {
              name: 'posts',
              label: 'Posts',
              label_singular: 'Post',
              folder: 'src/content/posts',
              create: true,
              slug: '{{slug}}',
              editor: { preview: false },
              fields: [
                { label: 'Título', name: 'title', widget: 'string' },
                { label: 'Descrição', name: 'description', widget: 'text' },
                {
                  label: 'Data de publicação',
                  name: 'pubDate',
                  widget: 'datetime',
                  format: 'YYYY-MM-DD',
                  date_format: 'DD/MM/YYYY',
                  time_format: false,
                },
                { label: 'Tags', name: 'tags', widget: 'list', default: [] },
                {
                  label: 'Rascunho',
                  name: 'draft',
                  widget: 'boolean',
                  default: false,
                  required: false,
                },
                { label: 'Conteúdo', name: 'body', widget: 'markdown' },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
