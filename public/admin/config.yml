backend:
  name: github
  repo: thecarrulo/blog
  branch: master
  auth_type: pkce
  app_id: Ov23liyN9UX9AhHLrk8B

media_folder: public/images
public_folder: /blog/images

collections:
  - name: posts
    label: Posts
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descrição, name: description, widget: text }
      - { label: Data, name: pubDate, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Rascunho, name: draft, widget: boolean, default: false, required: false }
      - { label: Conteúdo, name: body, widget: markdown }
